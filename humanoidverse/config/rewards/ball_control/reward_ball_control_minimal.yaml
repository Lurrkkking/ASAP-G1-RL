# @package _global_

rewards:
  set_reward: ball_control_minimal
  set_reward_date: 20260423
  only_positive_rewards: False

  reward_scales:
    # =========================
    # 一、dense 正奖励：每一步都会累计
    # =========================
    reposition_zone_reward: 6.0 # 补位阶段：球越接近前方目标点越好
    ball_in_target_state_zone_reward: 25.0  # 这是“维持控球状态”的主奖励
    control_touch_foot_to_ball_reward: 50.0     # CONTROL_TOUCH 阶段：接触前脚在靠近球就给奖励

    # =========================
    # 二、冲激式正奖励：只在事件发生瞬间给
    # =========================
    control_touch_contact_bonus: 1.0   # CONTROL_TOUCH 阶段发生正确右脚触球时给奖励
    # =========================
    # 三、冲激式惩罚：只在违规事件发生瞬间扣
    # =========================

    reposition_contact_violation_penalty: -1.0      # REPOSITION 阶段又碰到球，说明补位阶段乱碰球
    wrong_body_contact_penalty: -1.0    # 非目标身体部位碰球
    missed_target_state_cycle_penalty: -1.0       # 一次修正之后，球从头到尾没回到目标状态区

    # =========================
    # 四、dense 惩罚：每一步可能累计
    # =========================
    invalid_stance_penalty: -2.0      # 姿态非法：趴地、跪地、身体过度倾斜等
    ball_horizontal_vel_penalty: -1.0    # 球水平速度过大，防止斜飞
    ball_overshoot_penalty: -1.5        # 球超过目标高度上界，防止踢太高
    # ========================
    # 五、终止与通用正则
    # =========================
    termination: -200.0
    penalty_orientation: -0.5       # 身体姿态正则
    penalty_torques: -0.00008       # 扭矩 / 关节速度 / 动作变化正则
    penalty_dof_vel: -0.00008
    penalty_action_rate: -0.5     # action rate 不能太大，但现在还要鼓励出脚


  reposition_zone_reward_target: [0.35, -0.08, 0.75]    # 补位目标点
  reposition_zone_reward_weight: [4.0, 4.0, 2.0]     # x/y/z 三个方向的偏离惩罚
  control_zone_x_range: [0.25, 0.45]      # 目标状态区
  control_zone_y_range: [-0.25, 0.25]
  control_zone_z_range: [0.45, 1.00]
  control_zone_vz_min: 0.001

  # =========================
  # 冲激奖励/惩罚的事件幅值
  # 注意：这些值会再乘 reward_scales 中对应 scale
  # 如果基类对 scale 乘 dt，实际单次效果还会被 dt 缩放
  # =========================
  control_touch_contact_bonus: 400.0
  reposition_contact_violation_penalty: 80.0    # REPOSITION 阶段违规触球惩罚
  wrong_body_contact_penalty: 120.0   # 非目标身体部位碰球惩罚
  missed_target_state_cycle_penalty: 80.0  # 本轮修正失败：触球后从未回到目标状态区
  # =========================
  # dense 惩罚幅值
  # =========================
  invalid_stance_penalty: 5.0     # invalid_stance 每步固定惩罚值
  ball_horizontal_vel_penalty: 20.0

  reward_limit:
    soft_dof_pos_limit: 0.95
    soft_dof_vel_limit: 0.95
    soft_torque_limit: 0.90

    reward_limits_curriculum:
      soft_dof_pos_curriculum: False
      soft_dof_pos_initial_limit: 1.15
      soft_dof_pos_max_limit: 1.15
      soft_dof_pos_min_limit: 0.95
      soft_dof_pos_curriculum_degree: 0.00000025
      soft_dof_pos_curriculum_level_down_threshold: 40
      soft_dof_pos_curriculum_level_up_threshold: 42

      soft_dof_vel_curriculum: False
      soft_dof_vel_initial_limit: 1.15
      soft_dof_vel_max_limit: 1.15
      soft_dof_vel_min_limit: 0.95
      soft_dof_vel_curriculum_degree: 0.00000025
      soft_dof_vel_curriculum_level_down_threshold: 40
      soft_dof_vel_curriculum_level_up_threshold: 42

      soft_torque_curriculum: False
      soft_torque_initial_limit: 1.10
      soft_torque_max_limit: 1.10
      soft_torque_min_limit: 0.85
      soft_torque_curriculum_degree: 0.00000025
      soft_torque_curriculum_level_down_threshold: 40
      soft_torque_curriculum_level_up_threshold: 42

  reward_penalty_curriculum: False
  reward_initial_penalty_scale: 1.0
  reward_min_penalty_scale: 0.0
  reward_max_penalty_scale: 1.0
  reward_penalty_level_down_threshold: 100
  reward_penalty_level_up_threshold: 200
  reward_penalty_degree: 0.00001
  num_compute_average_epl: 10000

  # 目前只对 action_rate 做 penalty curriculum 的候选
  reward_penalty_reward_names: [
    "penalty_action_rate"
  ]