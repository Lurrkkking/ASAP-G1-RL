# @package _global_

rewards:
  set_reward: ball_control_kickup
  set_reward_date: 20260424
  only_positive_rewards: False

  reward_scales:
    reposition_zone_reward: 1.0
    ball_in_target_state_zone_reward: 4.0
    control_touch_foot_to_ball_reward: 10.0
    control_touch_contact_bonus: 1.0
    post_contact_upward_vel_reward: 70.0
    post_contact_height_reward: 90.0
    post_contact_recover_reward: 1.0
    reposition_contact_violation_penalty: -1.0
    wrong_body_contact_penalty: -1.0
    missed_target_state_cycle_penalty: 0.0
    invalid_stance_penalty: -2.0
    ball_horizontal_vel_penalty: -0.5
    ball_overshoot_penalty: -5.0 # 原0.2左右的水平，过小；5.0太大，直接落地上
    termination: -120.0
    penalty_orientation: -0.5
    penalty_torques: -0.005 
    penalty_dof_vel: -0.02
    penalty_action_rate: -0.3

  reposition_zone_reward_target: [0.28, -0.10, 0.16]
  reposition_zone_reward_weight: [8.0, 8.0, 12.0]
  recover_reposition_zone_scale: 0.2
  control_zone_x_range: [0.20, 0.55]
  control_zone_y_range: [-0.30, 0.15]
  control_zone_z_range: [0.50, 1.10]
  control_zone_vz_min: -10.0

  control_touch_contact_bonus: 350.0
  wrong_body_contact_penalty: 120.0
  reposition_contact_violation_penalty: 3.0
  missed_target_state_cycle_penalty: 0.0
  invalid_stance_penalty: 5.0
  ball_horizontal_vel_penalty: 200.0
  ball_horizontal_speed_penalty_tol: 0.4
  post_contact_vz_min: 0.3
  post_contact_vz_max: 1.0
  post_contact_height_min: 0.45
  post_contact_height_max: 1.10

# post-contact recovery window
  recover_start_steps: 5
  recover_end_steps: 30
  # overall scale for the whole post-contact recovery reward
  post_contact_recover_reward_scale: 1.2
  # sub-reward scales inside post-contact recovery
  recover_base_upright_scale: 1.0
  recover_base_height_scale: 0.5
  recover_base_vel_scale: 0.4
  recover_dof_ready_scale: 0.8
  recover_foot_ready_scale: 0.0
  recover_ball_body_dist_scale: 1.5

# error sensitivity; larger k means stricter reward decay
  recover_base_upright_k: 6.0
  recover_base_height_k: 10.0
  recover_base_vel_k: 2.0
  recover_dof_ready_k: 8.0
  recover_foot_ready_k: 10.0
  recover_ball_body_dist_k: 30.0
  recover_ball_body_dist_min: 0.30
  recover_ball_body_dist_max: 0.50
  recover_ball_front_x_min: 0.10
  # joint-name weights for ready-pose regularization:
  # torso / support leg high, arms medium, swing ankle low.
  recover_joint_weights:
    left_hip_pitch_joint: 1.4
    left_hip_roll_joint: 1.4
    left_hip_yaw_joint: 1.2
    left_knee_joint: 1.4
    left_ankle_pitch_joint: 1.0
    left_ankle_roll_joint: 1.0
    right_hip_pitch_joint: 0.9
    right_hip_roll_joint: 0.9
    right_hip_yaw_joint: 0.8
    right_knee_joint: 0.9
    right_ankle_pitch_joint: 0.3
    right_ankle_roll_joint: 0.3
    waist_yaw_joint: 1.3
    waist_roll_joint: 1.5
    waist_pitch_joint: 1.5
    left_shoulder_pitch_joint: 1.9
    left_shoulder_roll_joint: 1.9
    left_shoulder_yaw_joint: 1.5
    left_elbow_joint: 1.0
    right_shoulder_pitch_joint: 1.4
    right_shoulder_roll_joint: 1.4
    right_shoulder_yaw_joint: 1.2
    right_elbow_joint: 1.0

  reward_limit:
    soft_dof_pos_limit: 0.95
    soft_dof_vel_limit: 0.95
    soft_torque_limit: 0.90

    reward_limits_curriculum:
      soft_dof_pos_curriculum: False
      soft_dof_pos_initial_limit: 1.15
      soft_dof_pos_max_limit: 1.15
      soft_dof_pos_min_limit: 0.95
      soft_dof_pos_curriculum_degree: 0.00000025
      soft_dof_pos_curriculum_level_down_threshold: 40
      soft_dof_pos_curriculum_level_up_threshold: 42

      soft_dof_vel_curriculum: False
      soft_dof_vel_initial_limit: 1.15
      soft_dof_vel_max_limit: 1.15
      soft_dof_vel_min_limit: 0.95
      soft_dof_vel_curriculum_degree: 0.00000025
      soft_dof_vel_curriculum_level_down_threshold: 40
      soft_dof_vel_curriculum_level_up_threshold: 42

      soft_torque_curriculum: False
      soft_torque_initial_limit: 1.10
      soft_torque_max_limit: 1.10
      soft_torque_min_limit: 0.85
      soft_torque_curriculum_degree: 0.00000025
      soft_torque_curriculum_level_down_threshold: 40
      soft_torque_curriculum_level_up_threshold: 42

  reward_penalty_curriculum: False
  reward_initial_penalty_scale: 1.0
  reward_min_penalty_scale: 0.0
  reward_max_penalty_scale: 1.0
  reward_penalty_level_down_threshold: 100
  reward_penalty_level_up_threshold: 200
  reward_penalty_degree: 0.00001
  num_compute_average_epl: 10000
  reward_penalty_reward_names: [
    "penalty_action_rate"
  ]
