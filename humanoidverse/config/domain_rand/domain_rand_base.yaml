# @package _global_

domain_rand:
  # push robots
  push_robots : True
  push_interval_s : [8, 15]
  max_push_vel_xy : 0.6

  # base com
  randomize_base_com : True
  base_com_range:
    x : [-0.04, 0.04]
    y : [-0.04, 0.04]
    z : [-0.06, 0.06]

  # link mass
  randomize_link_mass : True
  link_mass_range : [0.7, 1.3]

  # pd gain
  randomize_pd_gain : True
  kp_range : [0.7, 1.3]
  kd_range : [0.7, 1.3]

  # friction
  randomize_friction : True
  friction_range : [0.3, 1.5]

  # base mass
  randomize_base_mass : True
  added_mass_range: [-3.0, 3.0] # 模拟背了点负载或者减重了

  # rfi
  randomize_torque_rfi : True
  rfi_lim : 0.05
  randomize_rfi_lim : True
  rfi_lim_range : [0.7, 1.3]


  # control delay
  randomize_ctrl_delay : True
  ctrl_delay_step_range : [0, 3] # integer max real delay is 90ms