# @package _global_

defaults:
  - legged_base

env:
  _target_: humanoidverse.envs.ball_control_task.ball_control_task.BallControlTask
  _recursive_: False
  config:
    robot: ${robot}
    domain_rand: ${domain_rand}
    rewards: ${rewards}
    terrain: ${terrain}
    obs: ${obs}
    env_spacing: 5.0
    max_episode_length_s: 2.0

    normalization:
      clip_actions: 100.0
      clip_observations: 100.0

    control_target_center: [0.35, 0.0, 0.70]
    control_touch_window_steps: 16
    control_touch_vz_trigger_max: 0.2 # 0.0
    target_contact_body: ${robot.right_foot_name}
    contact_force_threshold: 0.5  # 1.0
    ball_contact_force_threshold: 0.5   # 1.0
    contact_dist_threshold: 0.18
    ball_contact_min_height: 0.12
    valid_stance_base_height_min: 0.55
    valid_stance_roll_pitch_max: 0.50
    valid_stance_nonfoot_contact_check: False
    nonfoot_contact_force_threshold: 1.0
    right_toe_local_offset: [0.12, 0.0, -0.02]
    left_toe_local_offset: [0.12, 0.0, -0.02]
    ball_init_offset: [0.30, -0.15, 0.40]
    ball_init_pos_noise: [0.005, 0.005, 0.005]
    ball_init_lin_vel: [0.0, 0.0, 0.0]
    ball_init_lin_vel_noise: [0.0, 0.0, 0.0]
    ball_init_pos: [0.0, 0.0, 1.0]
    ball_init_rot: [0.0, 0.0, 0.0, 1.0]

    ball:
      radius: 0.10
      mass: 0.43
      friction: 0.8
      restitution: 0.45
      linear_damping: 0.01
      angular_damping: 0.01

    termination:
      terminate_on_ball_ground: False
      terminate_by_contact: False
      terminate_by_gravity: True
      terminate_by_low_height: False
      terminate_when_close_to_dof_pos_limit: False
      terminate_when_close_to_dof_vel_limit: False
      terminate_when_close_to_torque_limit: False
      ball_ground_height: 0.12

    termination_scales:
      termination_gravity_x: 0.8
      termination_gravity_y: 0.8
      termination_min_base_height: 0.3
      termination_close_to_dof_pos_limit: 0.98
      termination_close_to_dof_vel_limit: 0.98
      termination_close_to_torque_limit: 0.98

log_task_name: ball_control

eval_overrides:
  env:
    config:
      max_episode_length_s: 4.0
