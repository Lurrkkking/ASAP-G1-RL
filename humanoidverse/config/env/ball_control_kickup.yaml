# @package _global_

defaults:
  - ball_control

env:
  config:
    task_mode: kickup
    control_touch_window_steps: 18
    valid_stance_base_height_min: 0.60
    valid_stance_roll_pitch_max: 0.35
    valid_stance_nonfoot_contact_check: True
    nonfoot_contact_force_threshold: 0.5
    ball_init_offset: [0.40, 0.0, 0.6]
    ball_init_pos_noise: [0.015, 0.015, 0.01]
    ball_init_lin_vel: [0.0, 0.0, 0.0]
    ball_init_lin_vel_noise: [0.0, 0.0, 0.0]
    kickoff_ball_z_max: 0.8
    kickoff_x_range: [0.12, 0.50]
    kickoff_y_range: [-0.28, 0.28]

    termination:
      enable_ball_ground_termination: false
      terminate_by_low_height: True

    termination_scales:
      termination_min_base_height: 0.45
      termination_gravity_x: 0.65
      termination_gravity_y: 0.65
