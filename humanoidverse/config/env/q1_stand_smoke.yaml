# @package _global_

defaults:
  - legged_base

# Env structure — minimal standing smoke test
env:
  _target_: humanoidverse.envs.locomotion.stand_smoke.LeggedRobotStandSmoke
  config:
    max_episode_length_s: 20.0
    locomotion_obs_scales:
      lin_vel: 1.0
      ang_vel: 1.0
      dof_pos: 1.0
      dof_vel: 1.0

    # Zero / tiny velocity commands for stand survival
    locomotion_command_ranges:
      lin_vel_x: [0.0, 0.0]
      lin_vel_y: [0.0, 0.0]
      ang_vel_yaw: [0.0, 0.0]
      heading: [0.0, 0.0]

    locomotion_command_resampling_time: 10.0

    termination:
      terminate_by_contact: False
      terminate_by_gravity: True
      terminate_by_low_height: False
      terminate_when_close_to_dof_pos_limit: False
      terminate_when_close_to_dof_vel_limit: False
      terminate_when_close_to_torque_limit: False

    termination_scales:
      termination_min_base_height: 0.15
      termination_gravity_x: 0.8
      termination_gravity_y: 0.8

